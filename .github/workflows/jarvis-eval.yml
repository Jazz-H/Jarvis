name: Jarvis Eval

# The Ask Jarvis test set (agents/evals/ask-eval.ts): 12 real questions against fixed sample data,
# graded by code. It calls the real model (about $0.50 a run), so it only runs when started by hand.
# Only sample data is used, so the questions and answers it prints are safe in this public repo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - run: npm ci
      - run: npm run eval:ask
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-eval-${{ github.run_id }}
          path: agents/out/ask-eval.json
          retention-days: 30
          if-no-files-found: ignore
